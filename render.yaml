services:
  - type: web
    name: verifyai-backend
    runtime: python
    plan: free
    rootDir: verifyai-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: TAVILY_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: http://localhost:5173,http://localhost:5174
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_TEXT_LENGTH
        value: "50000"
      - key: CHUNK_SIZE_CHARS
        value: "3000"
      - key: MAX_CLAIMS_PER_CHUNK
        value: "8"
      - key: MAX_EVIDENCE_PER_CLAIM
        value: "5"
      - key: PYTHON_VERSION
        value: 3.11.9
